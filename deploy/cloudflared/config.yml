# Cloudflare Tunnel for Lemma. Its credentials file sits next to this one on the server only (see Secrets in deploy/README.md).
tunnel: b9f37d76-4c40-4ceb-9e02-8988a0755f90
credentials-file: /etc/cloudflared/lemma.json
ingress:
  - hostname: openlemma.org
    service: http://lemma:8765
  - hostname: www.openlemma.org  # Lemma redirects it to openlemma.org
    service: http://lemma:8765
  - service: http_status:404
