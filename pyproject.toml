[project]
name = "lemma"
version = "1.0.0"
description = "Turn a research paper into a short, hands-on lesson with live models, predictions and checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13.0",
    "pypdf>=4",
]

[project.scripts]
lemma = "lemma.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lemma"
module-root = ""
